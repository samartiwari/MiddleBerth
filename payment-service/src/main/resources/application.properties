spring.application.name=payment-service

# booking 8080, search 8081, gateway 8000
server.port=8083

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# stub = the fake gateway (tests, load tests). live = real Razorpay test mode (5e).
middleberth.razorpay.mode=stub

# The webhook secret proves a webhook came from Razorpay. The default is for dev
# and tests ONLY. Anywhere real RAZORPAY_WEBHOOK_SECRET must be set — this repo is
# public, and with the default anyone could forge "paid" and get free tickets.
middleberth.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:dev-only-webhook-secret-not-for-real-use}
