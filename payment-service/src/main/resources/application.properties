spring.application.name=payment-service

# booking 8080, search 8081, gateway 8000
server.port=8083

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# stub = the fake gateway (tests, load tests). live = real Razorpay test mode (5e).
middleberth.razorpay.mode=stub

# The webhook secret proves a webhook came from Razorpay. The default is for dev
# and tests ONLY. Anywhere real RAZORPAY_WEBHOOK_SECRET must be set — this repo is
# public, and with the default anyone could forge "paid" and get free tickets.
middleberth.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:dev-only-webhook-secret-not-for-real-use}

# The safety net: ask the gateway about unpaid orders every 15 seconds, once they
# are 30s old (let the webhook win first), until they are 30 minutes old.
middleberth.reconcile.interval=PT15S
middleberth.reconcile.min-age=PT30S
middleberth.reconcile.max-age=PT30M

# Refunds are money: retry for about two minutes, then park on refund-requests.DLT.
middleberth.refund-requests.retry.initial-interval=PT1S
middleberth.refund-requests.retry.max-interval=PT30S
middleberth.refund-requests.retry.max-attempts=8

# health for the probes, metrics so a parked dead letter can be alerted on:
# middleberth.dead.letters is the one that means "a human is needed".
management.endpoints.web.exposure.include=health,info,metrics

# Live Razorpay. Set RAZORPAY_MODE=live and these three, and the service will
# refuse to start without the keys rather than fail every customer later.
middleberth.razorpay.key-id=${RAZORPAY_KEY_ID:}
middleberth.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
middleberth.razorpay.api-url=${RAZORPAY_API_URL:https://api.razorpay.com/v1}
middleberth.razorpay.connect-timeout=PT3S
middleberth.razorpay.read-timeout=PT10S

# Finished payments are deleted after a week, the same window booking-service
# keeps its travel dates for. Without this the table grows by one row per Pay Now
# for ever.
middleberth.purge.at=0 30 12 * * *
middleberth.purge.zone=Asia/Kolkata
middleberth.purge.keep-days=7
