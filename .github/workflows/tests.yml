# Every push runs the whole test suite, and then starts the real system and books
# a ticket through it.
#
# The tests need Docker, because every one of them runs against real Postgres,
# real Kafka and real Redis through Testcontainers — never H2. That is the whole
# point: H2 does not implement FOR UPDATE SKIP LOCKED the way Postgres does, so
# the tests would pass while the code was broken. GitHub's runners have Docker, so
# the same tests run here unchanged.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push makes the previous run pointless. Stop it rather than pay for it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  suite:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Report every service, not just the first one that breaks.
      fail-fast: false
      matrix:
        service:
          - booking-service
          - search-service
          - payment-service
          - notification-service
          - gateway
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the tests
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B test

      # The surefire reports say which test failed and why. Without this, a red
      # tick is all you get.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  smoke:
    name: the whole system
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Build the five images, start everything, and book a real ticket through
      # nginx: token, search, book, poll, pay, signed webhook, confirmed, mailed.
      #
      # This is the part the unit tests cannot do. Running the system for the first
      # time found three bugs that 98 green tests had not: a compose command being
      # split on spaces, a deadlocked build cache, and no passenger to mail.
      - name: Build the images
        run: docker compose build

      - name: Start everything
        run: HTTP_PORT=8088 docker compose up -d

      # "up -d" returns when the containers start, not when Spring has booted and
      # the seeder has run. And "--wait" is wrong here: it counts the one-shot
      # seed container exiting 0 as a failure.
      - name: Wait until it is usable
        run: ./deploy/wait-ready.sh http://localhost:8088

      - name: Book a ticket end to end
        run: ./deploy/smoke.sh http://localhost:8088

      - name: Logs, if it failed
        if: failure()
        run: docker compose logs --tail 120

      - name: Stop everything
        if: always()
        run: docker compose down -v
