# The five services.
#
# Each one is a Deployment (how many copies, and what they run) plus a Service (a
# stable name and address in front of those copies). Nothing addresses a pod
# directly — pods come and go, names do not.
#
# imagePullPolicy: IfNotPresent matters here. These images only exist on this
# laptop, loaded into the cluster by up.sh; the default for a ":latest" tag is to
# go looking on Docker Hub, which would fail forever.
#
# Three probes, and they are not the same job:
#   startup    "still booting, do not judge me yet" — a JVM takes a few seconds
#   readiness  "send me traffic" / "stop sending me traffic"
#   liveness   "I am wedged, restart me"
# Without a readiness probe, Kubernetes sends requests to a pod that is still
# starting up and the user gets an error for no reason.
#
# The cpu request is what the autoscaler measures against, so every service has
# one. No request, no meaningful "70% of CPU".

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: middleberth
spec:
  replicas: 1
  selector:
    matchLabels: {app: booking-service}
  template:
    metadata:
      labels: {app: booking-service}
    spec:
      # Kubernetes injects an environment variable for every Service in the
      # namespace, in an old Docker format: a Service called "kafka" becomes
      # KAFKA_PORT=tcp://10.96.24.13:9092 inside every pod. The Kafka image turns
      # every KAFKA_* variable into a broker setting, so the broker was being
      # handed "port=tcp://10.96.24.13:9092" and refused to start. Nothing here
      # uses those variables — everything finds everything else by DNS name.
      enableServiceLinks: false
      containers:
        - name: booking-service
          image: middleberth-booking-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://booking-db:5432/booking"}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: {configMapKeyRef: {name: middleberth-config, key: POSTGRES_USER}}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: middleberth-secrets, key: POSTGRES_PASSWORD}}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {configMapKeyRef: {name: middleberth-config, key: KAFKA_BOOTSTRAP}}
            - name: REDIS_HOST
              valueFrom: {configMapKeyRef: {name: middleberth-config, key: REDIS_HOST}}
            - {name: PAYMENT_URL, value: "http://payment-service:8083"}
            # The JVM inside a container must be told what it may use, or it sizes
            # the heap from the whole machine and gets killed for going over.
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70 -Dnetworkaddress.cache.ttl=5"}
          startupProbe:
            httpGet: {path: /actuator/health, port: 8080}
            failureThreshold: 40
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "2", memory: 900Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: middleberth
spec:
  selector: {app: booking-service}
  ports: [{port: 8080, targetPort: 8080}]

