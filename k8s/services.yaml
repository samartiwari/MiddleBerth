apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: middleberth
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      enableServiceLinks: false   # see the note above
      containers:
        - name: gateway
          image: middleberth-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: R2DBC_URL, value: "r2dbc:postgresql://auth-db:5432/auth"}
            - {name: FLYWAY_URL, value: "jdbc:postgresql://auth-db:5432/auth"}
            - name: DB_USERNAME
              valueFrom: {configMapKeyRef: {name: middleberth-config, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: middleberth-secrets, key: POSTGRES_PASSWORD}}
            # OFF. With it on, anybody can be anybody.
            - {name: AUTH_DEMO_TOKENS, value: "false"}
            - {name: BOOKING_URL, value: "http://booking-service:8080"}
            - {name: SEARCH_URL, value: "http://search-service:8081"}
            - {name: PAYMENT_URL, value: "http://payment-service:8083"}
            - name: SPRING_DATA_REDIS_HOST
              valueFrom: {configMapKeyRef: {name: middleberth-config, key: REDIS_HOST}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: middleberth-secrets, key: JWT_SECRET}}
            # The JVM inside a container must be told what it may use, or it sizes
            # the heap from the whole machine and gets killed for going over.
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70 -Dnetworkaddress.cache.ttl=5"}
          startupProbe:
            httpGet: {path: /actuator/health, port: 8000}
            failureThreshold: 40
            periodSeconds: 3
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8000}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8000}
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "2", memory: 900Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: middleberth
spec:
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000}]

---
# The front door. Same config file as docker compose uses, kept in a ConfigMap so
# it can be changed without rebuilding an image.
#
# The startup DNS lookup that the comment in that file warns about is fine here:
# "gateway" is a Service, and a Service has one address that never changes, no
# matter how many pods the autoscaler puts behind it. Kubernetes does the
# balancing, so nginx can keep its connections open.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: middleberth
data:
  default.conf: |
    # The only thing the outside world can reach.
    #
    # Connections to the gateway are REUSED. Without the keepalive block below, nginx
    # opens a fresh TCP connection for every request and each one leaves a socket in
    # TIME_WAIT for a couple of minutes. Under load the machine runs out of ephemeral
    # ports and nginx starts answering 502:
    #
    #   connect() to 172.22.0.12:8000 failed (99: Address not available)
    #
    # Measured: 8,510 of 36,741 requests failed that way in a 2,000 user run. The
    # booking path survived it; browsing did not.
    #
    # The cost of an upstream block is that nginx resolves the name once, at startup.
    # That is the other trap: with several gateway containers behind one name, every
    # request goes to whichever one nginx found first and the rest idle. It looks like
    # load balancing. If this ever fronts more than one gateway, the fix is a
    # `resolver 127.0.0.11` line and the address in a VARIABLE in proxy_pass, which
    # makes nginx look it up per request — at the price of these reused connections.
    #
    # Here there is one gateway, and in Kubernetes a Service does the balancing, so
    # reuse wins.

    upstream gateway {
        server gateway:8000;

        keepalive 64;             # idle connections kept open, ready for the next request
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    server {
        listen 80;
        server_name _;

        # Not nginx's job to decide who may book — the gateway does that, and it needs
        # to see the request exactly as it was sent. In particular the Razorpay webhook
        # body must arrive byte for byte, or its signature will not match.
        location / {
            proxy_pass http://gateway;

            # Both lines are required for the reuse above: HTTP/1.1, and clearing the
            # Connection header nginx would otherwise send as "close".
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Nobody from outside gets to claim they are a user. The gateway sets this
            # header itself from the token, but it can only strip what reaches it.
            proxy_set_header X-User-Id "";

            proxy_connect_timeout 2s;
            proxy_read_timeout    30s;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: middleberth
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx}
  template:
    metadata:
      labels: {app: nginx}
    spec:
      enableServiceLinks: false   # see the note above
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
          readinessProbe:
            httpGet: {path: /api/trains, port: 80}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: "1", memory: 128Mi}
      volumes:
        - name: conf
          configMap: {name: nginx-conf}
---
# NodePort, not ClusterIP: this is the one thing reachable from the laptop, and
# kind maps node port 30080 to localhost:8088. Everything else in this namespace
# can only be reached from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: middleberth
spec:
  type: NodePort
  selector: {app: nginx}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
