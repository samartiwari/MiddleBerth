# One train with berths, and somebody to mail.
#
# A Job, not a Deployment: it runs once, finishes, and stays finished. It waits
# for the tables to exist rather than for a service to be "up", because the tables
# are made by Flyway inside the services, after they connect.
#
# Only berths are seeded. Passengers come with the booking request now.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-sql
  namespace: middleberth
data:
  SEED_BOOKING: "-- One train, and what it HAS.\n--\n-- Not \"seats for tomorrow\" any more: the daily quota window job turns this into\n-- berths for each new travel date, and deletes dates older than a week. So the\n-- demo keeps working tomorrow, and next month, without growing.\n--\n-- 24 berths in 3A and 72 in sleeper \u2014 the real shape of a tatkal quota, and small\n-- enough that a few hundred people fighting over it is a genuine contest.\nINSERT INTO train (number, name) VALUES ('12951', 'Mumbai Rajdhani')\nON CONFLICT (number) DO NOTHING;\n\nINSERT INTO train_quota (train_id, coach_class, coach, berths)\nSELECT t.id, '3A', 'B2', 24 FROM train t WHERE t.number = '12951'\nON CONFLICT DO NOTHING;\n\nINSERT INTO train_quota (train_id, coach_class, coach, berths)\nSELECT t.id, 'SL', 'S4', 72 FROM train t WHERE t.number = '12951'\nON CONFLICT DO NOTHING;\n\n-- Open tomorrow immediately, so the demo has something to sell the moment it\n-- starts rather than at the next noon. The job does exactly this, every day.\nINSERT INTO seat (train_id, travel_date, coach_class, coach, seat_no, status)\nSELECT q.train_id, CURRENT_DATE + 1, q.coach_class, q.coach, n::text, 'FREE'\nFROM train_quota q, generate_series(1, 100) AS n\nWHERE n <= q.berths\nON CONFLICT DO NOTHING;\n\nSELECT coach_class, count(*) AS berths, travel_date FROM seat\nGROUP BY coach_class, travel_date ORDER BY coach_class;\n"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: middleberth
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: middleberth-secrets, key: POSTGRES_PASSWORD}}
            - name: SEED_BOOKING
              valueFrom: {configMapKeyRef: {name: seed-sql, key: SEED_BOOKING}}
          command:
            - sh
            - -c
            - |
              echo "waiting for booking-service to create its tables"
              until psql -h booking-db -U middleberth -d booking -c '\d seat' >/dev/null 2>&1; do sleep 3; done
              printf '%s' "$SEED_BOOKING" | psql -h booking-db -U middleberth -d booking -v ON_ERROR_STOP=1 -f -
              echo "seeded"
