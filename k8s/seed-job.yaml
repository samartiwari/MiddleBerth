# One train with berths, and somebody to mail.
#
# A Job, not a Deployment: it runs once, finishes, and stays finished. It waits
# for the tables to exist rather than for a service to be "up", because the tables
# are made by Flyway inside the services, after they connect.
#
# Only berths are seeded. Passengers come with the booking request now.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seed-sql
  namespace: middleberth
data:
  SEED_BOOKING: "-- Enough berths for a load test: five trains, two classes each.\n--\n--   3A  24 berths   SL  72 berths      x 5 trains = 480 berths\n--\n-- The waitlist cap equals the berth count, so about 960 people can get an answer\n-- that is not \"sorry\". Anyone after that is REGRETTED, which is exactly what\n-- tatkal looks like at 10:00:01.\n--\n-- Safe to run again.\n\nINSERT INTO train (number, name) VALUES\n    ('12951', 'Mumbai Rajdhani'),\n    ('12009', 'Shatabdi Express'),\n    ('22691', 'Bengaluru Rajdhani'),\n    ('12259', 'Sealdah Duronto'),\n    ('12627', 'Karnataka Express')\nON CONFLICT (number) DO NOTHING;\n\nINSERT INTO seat (train_id, travel_date, coach_class, coach, seat_no, status)\nSELECT t.id, CURRENT_DATE + 1, '3A', 'B2', n::text, 'FREE'\nFROM train t, generate_series(1, 24) AS n\nON CONFLICT DO NOTHING;\n\nINSERT INTO seat (train_id, travel_date, coach_class, coach, seat_no, status)\nSELECT t.id, CURRENT_DATE + 1, 'SL', 'S4', n::text, 'FREE'\nFROM train t, generate_series(1, 72) AS n\nON CONFLICT DO NOTHING;\n\nSELECT coach_class, count(*) AS berths, count(DISTINCT train_id) AS trains\nFROM seat WHERE travel_date = CURRENT_DATE + 1\nGROUP BY coach_class;\n"

---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: middleberth
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: middleberth-secrets, key: POSTGRES_PASSWORD}}
            - name: SEED_BOOKING
              valueFrom: {configMapKeyRef: {name: seed-sql, key: SEED_BOOKING}}
          command:
            - sh
            - -c
            - |
              echo "waiting for booking-service to create its tables"
              until psql -h booking-db -U middleberth -d booking -c '\d seat' >/dev/null 2>&1; do sleep 3; done
              printf '%s' "$SEED_BOOKING" | psql -h booking-db -U middleberth -d booking -v ON_ERROR_STOP=1 -f -
              echo "seeded"
