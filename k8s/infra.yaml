---
# One broker, being its own controller. A real cluster runs three and replicates
# every partition; here one replica of everything and no durability beyond the
# pod's life. The advertised address must be the name other pods can reach.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: middleberth
spec:
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      enableServiceLinks: false   # see the note above
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            # localhost, NOT kafka:9093. The controller lives in this same pod, and
            # the "kafka" name resolves to a Service that only forwards 9092 — so
            # reaching the controller through it timed out and the broker never
            # finished starting. In compose every port on the container was
            # reachable by name, which hid this.
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: CLUSTER_ID, value: "middleberth-single-node"}
          ports: [{containerPort: 9092}]
          # A socket check, not kafka-topics.sh. That script starts a JVM of its
          # own every time it runs, which took longer than any sane probe timeout
          # on a busy laptop — the broker was up and being marked unhealthy for
          # being slow to answer a question about itself. Kafka only accepts
          # connections on 9092 once it has finished starting, so the socket being
          # open is the honest signal here.
          readinessProbe:
            tcpSocket: {port: 9092}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 1500Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: middleberth
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092}]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: middleberth
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      enableServiceLinks: false   # see the note above
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: middleberth
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
