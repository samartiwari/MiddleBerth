# Everything the services need before they can start: somewhere to keep data, a
# queue, a cache, and the settings they all share.
#
# The databases use emptyDir — memory-and-disk that dies with the pod. This
# cluster exists to be load tested and thrown away; a real one would use a
# StatefulSet with a real volume so a restarted database still has its rows.
apiVersion: v1
kind: Namespace
metadata:
  name: middleberth

---
# Settings that are not secret. Changing one of these is a restart, not a rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: middleberth-config
  namespace: middleberth
data:
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_HOST: redis
  POSTGRES_USER: middleberth
  MAIL_MODE: log
  RAZORPAY_MODE: stub

---
# The things that must not be in a ConfigMap, a git repository, or an image.
# up.sh creates this from the environment, with dev defaults if nothing is set.
apiVersion: v1
kind: Secret
metadata:
  name: middleberth-secrets
  namespace: middleberth
type: Opaque
stringData:
  POSTGRES_PASSWORD: middleberth
  JWT_SECRET: dev-only-secret-change-me-it-must-be-32-bytes-or-more
  RAZORPAY_WEBHOOK_SECRET: dev-only-webhook-secret-not-for-real-use

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-db
  namespace: middleberth
spec:
  replicas: 1
  selector:
    matchLabels: {app: booking-db}
  template:
    metadata:
      labels: {app: booking-db}
    spec:
      # Kubernetes injects an environment variable for every Service in the
      # namespace, in an old Docker format: a Service called "kafka" becomes
      # KAFKA_PORT=tcp://10.96.24.13:9092 inside every pod. The Kafka image turns
      # every KAFKA_* variable into a broker setting, so the broker was being
      # handed "port=tcp://10.96.24.13:9092" and refused to start. Nothing here
      # uses those variables — everything finds everything else by DNS name.
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: booking
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: middleberth-config, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: middleberth-secrets, key: POSTGRES_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          # Not ready until it can actually answer. Until then, no service sends
          # it traffic and no pod that depends on it gets past its own probe.
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U middleberth -d booking"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: booking-db
  namespace: middleberth
spec:
  selector: {app: booking-db}
  ports: [{port: 5432, targetPort: 5432}]

