# The only thing the outside world can reach.
#
# Connections to the gateway are REUSED. Without the keepalive block below, nginx
# opens a fresh TCP connection for every request and each one leaves a socket in
# TIME_WAIT for a couple of minutes. Under load the machine runs out of ephemeral
# ports and nginx starts answering 502:
#
#   connect() to 172.22.0.12:8000 failed (99: Address not available)
#
# Measured: 8,510 of 36,741 requests failed that way in a 2,000 user run. The
# booking path survived it; browsing did not.
#
# The cost of an upstream block is that nginx resolves the name once, at startup.
# That is the other trap: with several gateway containers behind one name, every
# request goes to whichever one nginx found first and the rest idle. It looks like
# load balancing. If this ever fronts more than one gateway, the fix is a
# `resolver 127.0.0.11` line and the address in a VARIABLE in proxy_pass, which
# makes nginx look it up per request — at the price of these reused connections.
#
# Here there is one gateway, and in Kubernetes a Service does the balancing, so
# reuse wins.

# Where each request's time goes, one line per request.
#
#   total             nginx's whole handling of the request
#   upstream_header   from handing it to the gateway until the gateway starts answering
#
# total minus upstream_header is nginx itself. For a booking, upstream_header minus
# booking-service's own timer is the gateway. Without these two numbers "the front
# door is slow" cannot be split into WHICH part of the front door is slow.
#
# Costs one log line per request, into docker's log. Around 7 MB for a 50,000
# request load run.
log_format timing '$time_iso8601 $request_method $uri $status '
                  'total=$request_time upstream_connect=$upstream_connect_time '
                  'upstream_header=$upstream_header_time';

upstream gateway {
    server gateway:8000;

    # Idle connections kept open per nginx worker, ready for the next request. It
    # has to cover every request in flight, not a typical moment: past this number
    # nginx opens extra connections and closes each one afterwards, and a closed
    # connection holds its local port for a minute. At 64 that is what broke at
    # 1,000 bookings a second. After about 40 seconds all ~28,000 local ports were
    # waiting out their minute, and nginx answered 104,000 requests with an
    # instant 502 without ever reaching the gateway.
    keepalive 1024;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log timing;

    # Not nginx's job to decide who may book — the gateway does that, and it needs
    # to see the request exactly as it was sent. In particular the Razorpay webhook
    # body must arrive byte for byte, or its signature will not match.
    location / {
        proxy_pass http://gateway;

        # Both lines are required for the reuse above: HTTP/1.1, and clearing the
        # Connection header nginx would otherwise send as "close".
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nobody from outside gets to claim they are a user. The gateway sets this
        # header itself from the token, but it can only strip what reaches it.
        proxy_set_header X-User-Id "";

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
