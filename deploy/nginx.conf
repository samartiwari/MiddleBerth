# The only thing the outside world can reach.
#
# The gotcha this file exists for: nginx resolves a hostname ONCE at startup and
# caches it forever. With several gateway containers behind one name, every
# request would go to whichever one nginx looked up first, and the others would
# sit idle. It looks like load balancing and is not.
#
# The fix is both lines below: a resolver (Docker's own DNS, always 127.0.0.11)
# and the address in a VARIABLE. A variable in proxy_pass makes nginx look the
# name up per request instead of at startup.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Not nginx's job to decide who may book — the gateway does that, and it needs
    # to see the request exactly as it was sent. In particular the Razorpay webhook
    # body must arrive byte for byte, or its signature will not match.
    location / {
        set $upstream http://gateway:8000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nobody from outside gets to claim they are a user. The gateway sets this
        # header itself from the token, but it can only strip what reaches it.
        proxy_set_header X-User-Id "";

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;
    }
}
