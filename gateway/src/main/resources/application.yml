# The only service the outside world talks to. Checks who you are, throws away
# excess traffic, and sends the rest to the right place.

server:
  port: 8000   # locally. booking is on 8080, search on 8081. In Docker all are 8080.

middleberth:
  # Overridden by env vars in Docker, where services are reached by name.
  booking-url: ${BOOKING_URL:http://localhost:8080}
  search-url: ${SEARCH_URL:http://localhost:8081}
  payment-url: ${PAYMENT_URL:http://localhost:8083}
  auth:
    # A token for any user id you name, with no password. The load test needs it;
    # nothing else should have it. OFF here, turned on explicitly for the laptop
    # demo and by the tests.
    demo-tokens: ${AUTH_DEMO_TOKENS:false}
    # Guessing is an attack on one ACCOUNT, so it is counted per account. An IP
    # limit tight enough to stop it would lock out a whole college hostel.
    max-login-failures: 5
    lockout: PT15M
    # Creating many accounts IS one machine doing it, so that is capped per IP.
    max-signups-per-ip: 10
    signup-window: PT1H

  jwt:
    # HS256 needs at least 32 bytes. The default is for dev and tests ONLY —
    # anywhere real, JWT_SECRET must be set, or anyone can mint tokens.
    secret: ${JWT_SECRET:dev-only-secret-change-me-it-must-be-32-bytes-or-more}
    ttl-minutes: 60

spring:
  application:
    name: gateway
  # Accounts live in the gateway's own database, because the gateway is what
  # owns logging in. R2DBC at runtime; Flyway speaks JDBC and only runs at startup.
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/auth}
    username: ${DB_USERNAME:middleberth}
    password: ${DB_PASSWORD:middleberth}
  flyway:
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5432/auth}
    user: ${DB_USERNAME:middleberth}
    password: ${DB_PASSWORD:middleberth}
  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Browsing. Public, and deliberately NOT rate limited per client.
            # Indian mobile carriers put thousands of users behind one IP, so any
            # IP limit tight enough to stop a bot locks out a college hostel. Search
            # reads one Redis key and takes nothing from anyone — it is protected by
            # being cheap, and by adding pods under load, not by turning people away.
            - id: search
              uri: ${middleberth.search-url}
              predicates:
                - Path=/api/trains/**

            # Booking. Needs a token, and is limited PER USER — so a hundred people
            # on one college wifi each get their own bucket. This is where fairness
            # matters: one person must not be able to take 500 places in the queue.
            - id: booking-create
              uri: ${middleberth.booking-url}
              predicates:
                - Path=/api/bookings
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1     # tokens added per second
                    redis-rate-limiter.burstCapacity: 3     # most it can hold
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            # Polling for the answer. Looser — the page asks every second or two.
            - id: booking-poll
              uri: ${middleberth.booking-url}
              predicates:
                - Path=/api/bookings/**
                - Method=GET
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            # Pay Now. Same rule as booking — needs a token, limited per user.
            - id: booking-pay
              uri: ${middleberth.booking-url}
              predicates:
                - Path=/api/bookings/*/pay
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 3
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            # The passenger master list. Read and edited long before the rush, so
            # the limit is loose — it is a list, not a race.
            - id: passengers
              uri: ${middleberth.booking-url}
              predicates:
                - Path=/api/passengers/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 15
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@userKeyResolver}"

            # Razorpay telling us a payment went through. No login — Razorpay has no
            # token. It is trusted because payment-service checks the signature, and
            # the gateway passes the body through byte for byte so that still works.
            #
            # payment-service's /internal/** has no route here on purpose. Only
            # booking-service may create orders, and it reaches payment-service
            # directly on the internal network.
            - id: razorpay-webhook
              uri: ${middleberth.payment-url}
              predicates:
                - Path=/webhooks/razorpay
                - Method=POST

management:
  endpoints:
    web:
      exposure:
        # health for the probes, metrics so anything worth alerting on is reachable
        include: health,info,metrics
