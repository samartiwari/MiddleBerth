spring.application.name=search-service

# booking-service is on 8080
server.port=8081

# Flyway owns the schema. Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Its OWN group id, so this service gets every seat-count event independently of
# booking-service. That is fan-out — sharing booking's group id would steal its
# messages and silently break bookings.
spring.kafka.consumer.group-id=search-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.middleberth.search.dto

# booking-service stamps its own class name on the message. That class does not
# exist here, so ignore the header and always build our own copy of the record.
# The two services share a message shape, not a jar.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.middleberth.search.dto.SeatCountEvent
