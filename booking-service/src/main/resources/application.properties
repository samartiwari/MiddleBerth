spring.application.name=booking-service

# Flyway owns the schema. Hibernate only checks that the entities match it,
# and refuses to start if they do not.
spring.jpa.hibernate.ddl-auto=validate

# Don't hold a database session open for the whole web request. (only when needed)
spring.jpa.open-in-view=false

# Kafka. The key is train+date+class, so one train always lands on one partition
# and is processed by one consumer, one message at a time, in arrival order.
spring.kafka.consumer.group-id=booking-service
# The consumer should consume from the first ticket not the ticket generated after it came into existence (latest)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.middleberth.booking.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.middleberth.booking.dto.BookingCommand
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Holds. The user is told they have 5 minutes. The hold is actually released a
# minute after that, so a payment made at 4:59 is not lost to our own lag.
middleberth.hold.pay-within=PT5M
middleberth.hold.cushion=PT1M
# Someone who clicked Pay Now gets up to 3 more minutes before the hold is released.
middleberth.hold.payment-grace=PT3M
middleberth.hold.expiry-interval=PT10S
middleberth.hold.batch-size=100

# The one synchronous service-to-service call: Pay Now -> payment-service.
middleberth.payment-url=${PAYMENT_URL:http://localhost:8083}

# Flat fare per class, in paise. Brackets keep keys like "3A" exactly as written.
middleberth.fares[1A]=510000
middleberth.fares[2A]=380000
middleberth.fares[3A]=240000
middleberth.fares[SL]=90000

# If confirming a payment fails, retry with growing gaps for about two minutes —
# long enough to ride out a database blip — then park it on payment-events.DLT
# instead of dropping it. 1s, 2s, 4s, 8s, 16s, 30s, 30s, 30s.
middleberth.payment-events.retry.initial-interval=PT1S
middleberth.payment-events.retry.max-interval=PT30S
middleberth.payment-events.retry.max-attempts=8

# The outbox: notes are written with the booking, and go out a second later.
middleberth.outbox.interval=PT1S
middleberth.outbox.batch-size=100

# The front door waits this long for Kafka to confirm a booking request. If it
# cannot, the answer is 503 and not a request id for work that will never happen.
middleberth.intake.ack-timeout=PT3S

# Fail fast rather than block a request thread: the producer's own defaults would
# keep retrying for two minutes, long after the user has given up.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=8000
spring.kafka.producer.properties.request.timeout.ms=5000

# Wait up to 5ms to fill a batch. Now that every request waits for its own
# acknowledgement, batching is what stops 2,000 people at 10:00:00 becoming 2,000
# separate round trips to the broker. Costs 5ms when nothing else is happening.
spring.kafka.producer.properties.linger.ms=5

# A booking request that keeps failing is retried for about two minutes and then
# parked on booking-requests.DLT. Never dropped — somebody was promised a ticket.
middleberth.booking-requests.retry.initial-interval=PT1S
middleberth.booking-requests.retry.max-interval=PT30S
middleberth.booking-requests.retry.max-attempts=8

# health for the probes, metrics so a parked dead letter can be alerted on:
# middleberth.dead.letters is the one that means "a human is needed".
management.endpoints.web.exposure.include=health,info,metrics
