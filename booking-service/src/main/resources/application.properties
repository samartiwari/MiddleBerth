spring.application.name=booking-service

# Flyway owns the schema. Hibernate only checks that the entities match it,
# and refuses to start if they do not.
spring.jpa.hibernate.ddl-auto=validate

# Don't hold a database session open for the whole web request. (only when needed)
spring.jpa.open-in-view=false

# Kafka. The key is train+date+class, so one train always lands on one partition
# and is processed by one consumer, one message at a time, in arrival order.
spring.kafka.consumer.group-id=booking-service
# The consumer should consume from the first ticket not the ticket generated after it came into existence (latest)
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.middleberth.booking.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.middleberth.booking.dto.BookingCommand
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Holds. The user is told they have 5 minutes. The hold is actually released a
# minute after that, so a payment made at 4:59 is not lost to our own lag.
middleberth.hold.pay-within=PT5M
middleberth.hold.cushion=PT1M
# Someone who clicked Pay Now gets up to 3 more minutes before the hold is released.
middleberth.hold.payment-grace=PT3M
middleberth.hold.expiry-interval=PT10S
middleberth.hold.batch-size=100

# The one synchronous service-to-service call: Pay Now -> payment-service.
middleberth.payment-url=${PAYMENT_URL:http://localhost:8083}

# Flat fare per class, in paise. Brackets keep keys like "3A" exactly as written.
middleberth.fares[1A]=510000
middleberth.fares[2A]=380000
middleberth.fares[3A]=240000
middleberth.fares[SL]=90000
# On top of the fare, and NOT refunded when a passenger cancels — it is what pays
# the gateway's cut, which is taken on the way in and never comes back. Must stay
# above cut/(1-cut): at Razorpay's 2.36% that floor is 2.4171%, so 3% it is.
# In basis points, because money and floating point do not mix. 300 = 3.00%.
middleberth.convenience-fee-bps=300

# If confirming a payment fails, retry with growing gaps for about two minutes —
# long enough to ride out a database blip — then park it on payment-events.DLT
# instead of dropping it. 1s, 2s, 4s, 8s, 16s, 30s, 30s, 30s.
middleberth.payment-events.retry.initial-interval=PT1S
middleberth.payment-events.retry.max-interval=PT30S
middleberth.payment-events.retry.max-attempts=8

# The outbox: notes are written with the booking, and go out a second later.
middleberth.outbox.interval=PT1S
middleberth.outbox.batch-size=100

# The front door waits this long for Kafka to confirm a booking request. If it
# cannot, the answer is 503 and not a request id for work that will never happen.
middleberth.intake.ack-timeout=PT3S

# Fail fast rather than block a request thread: the producer's own defaults would
# keep retrying for two minutes, long after the user has given up.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=8000
spring.kafka.producer.properties.request.timeout.ms=5000

# Wait up to 5ms to fill a batch. Now that every request waits for its own
# acknowledgement, batching is what stops 2,000 people at 10:00:00 becoming 2,000
# separate round trips to the broker. Costs 5ms when nothing else is happening.
spring.kafka.producer.properties.linger.ms=5

# A booking request that keeps failing is retried for about two minutes and then
# parked on booking-requests.DLT. Never dropped — somebody was promised a ticket.
middleberth.booking-requests.retry.initial-interval=PT1S
middleberth.booking-requests.retry.max-interval=PT30S
middleberth.booking-requests.retry.max-attempts=8

# Threads taking booking requests off Kafka. Each partition goes to exactly one
# thread, so with 15 partitions and one instance owning all of them, 15 is the most
# that can ever have work. This was never set, so it was Spring's default of ONE:
# every booking went through a single thread that spent two thirds of its time
# waiting on Postgres. With several instances, instances x this should not pass 15.
middleberth.booking-requests.concurrency=${BOOKING_CONSUMER_THREADS:15}

# Database connections. Consumer threads and web requests share this pool, so it
# must be bigger than the consumer threads, or they only swap waiting for a thread
# for waiting for a connection. booking-db allows 100 in total: with several
# instances, instances x this must stay under that.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}

# health for the probes, metrics so a parked dead letter can be alerted on:
# middleberth.dead.letters is the one that means "a human is needed".
management.endpoints.web.exposure.include=health,info,metrics

# Every seat count, republished from scratch on this loop. It fills a cold Redis
# at search-service the moment this service starts, and repairs any count that
# went missing. Cheap here; a real system would limit it to the booking window.
middleberth.seat-counts.snapshot-interval=PT5M

# The booking window rolls forward once a day: tomorrow goes on sale, and travel
# dates older than keep-days are deleted. That second half is what keeps storage
# flat instead of growing by a few thousand rows every day for ever.
#
# The zone matters: a container runs on UTC, and noon has to mean noon in India.
middleberth.quota.open-at=0 0 12 * * *
middleberth.quota.zone=Asia/Kolkata
middleberth.quota.days-ahead=1
# A week of history. Travel dates older than this go, so the database holds about
# nine days of data whether this runs for a month or a year.
middleberth.quota.keep-days=7
middleberth.quota.open-on-startup=true

# Where the polled answer is cached, so every waiting page is not a query against
# the database the consumer needs for claiming berths.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# A few seconds of staleness on a page that polls every second anyway. Short
# enough that no invalidation is needed anywhere — nothing has to remember to
# clear this when a booking is paid for, expires or is cancelled.
middleberth.cache.outcome-ttl=PT3S
# A regret is kept nowhere else, so it gets minutes rather than seconds.
middleberth.cache.regret-ttl=PT15M
# Accepted at the door and not decided yet. A page asking about one of these within
# pending-trust is told "still waiting" by Redis alone, because the booking thread
# writes the answer there the moment it has one. Past it, Postgres is asked as well,
# in case that write was lost. Without this, every poll for an undecided booking was
# a query against the database the booking threads were claiming berths from.
middleberth.cache.pending-ttl=PT2M
middleberth.cache.pending-trust=PT5S
