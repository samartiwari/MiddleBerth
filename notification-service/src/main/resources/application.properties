spring.application.name=notification-service

# booking 8080, search 8081, payment 8083, gateway 8000
server.port=8084

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# log  = write the mail to the log (tests, load tests, the demo)
# smtp = actually send it, using spring.mail.* from the environment
middleberth.mail.mode=${MAIL_MODE:log}
middleberth.mail.from=${MAIL_FROM:tickets@middleberth.invalid}

# A mail server can be down for a while. Keep trying for about two minutes, then
# park the message on booking-events.DLT rather than losing someone's ticket.
middleberth.booking-events.retry.initial-interval=PT1S
middleberth.booking-events.retry.max-interval=PT30S
middleberth.booking-events.retry.max-attempts=8

# health for the probes, metrics so a parked dead letter can be alerted on:
# middleberth.dead.letters is the one that means "a human is needed".
management.endpoints.web.exposure.include=health,info,metrics

# Spring Boot's mail health check logs in to the mail server on every probe and
# reports this service DOWN whenever it cannot, including whenever mail is only
# being logged and there are no credentials to log in with. On the live server that
# made Docker mark a working service unhealthy. Whether mail is working is not
# whether this service is alive: a failed send retries and then lands on the dead
# letter topic, and MAIL_MODE=smtp already refuses to start without credentials.
management.health.mail.enabled=false

# The record of a sent mail is kept for a week — as long as Kafka keeps the
# message that could duplicate it. Without this the table grows by one row per
# mail for ever.
middleberth.purge.at=0 45 12 * * *
middleberth.purge.zone=Asia/Kolkata
middleberth.purge.keep-days=7

# The mail server, for MAIL_MODE=smtp. Nothing here is a secret: the values come
# from the environment and the defaults are only the shape of a Gmail account.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# A mail server that accepts the connection and then says nothing would otherwise
# hold this consumer for ever, and one stuck thread is one partition not moving.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
